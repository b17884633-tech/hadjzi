# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hadjzi-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OTP_DEV_ECHO
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_TZ
        value: Asia/Aden
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://hadjzi-admin.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: hadjzi
      # Firebase Admin — required to verify Phone Auth ID tokens from the app
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
